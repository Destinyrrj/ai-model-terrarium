name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v4.2.2, pinned to avoid mutable action tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # v5.6.0, pinned to avoid mutable action tags.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      # v4.4.0, pinned to avoid mutable action tags.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.28
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev
          uv sync --project gui --frozen --group dev
      - name: Build GUI frontend
        working-directory: gui/frontend
        run: |
          npm ci
          npm run test
          npm run build
      - name: Lint
        run: uv run --project gui --frozen ruff check .
      - name: Test
        run: uv run --project gui --frozen pytest --cov=terrarium --cov=terrarium_gui --cov-report=term-missing
      - name: Build and inspect GUI sdist
        run: |
          uv build --project gui --sdist --clear
          python -c "import glob,tarfile; p=glob.glob('gui/dist/*.tar.gz'); assert len(p)==1; n=tarfile.open(p[0]).getnames(); assert any(x.endswith('/src/terrarium_gui/__init__.py') for x in n); assert not any('node_modules' in x for x in n); assert len(n)<500"
      - name: Build wheel from sdist and smoke install
        run: |
          uv build --wheel gui/dist/*.tar.gz --out-dir gui/dist/from-sdist
          python -m venv /tmp/terrarium-gui-wheel-smoke
          /tmp/terrarium-gui-wheel-smoke/bin/pip install --no-deps gui/dist/from-sdist/*.whl
          /tmp/terrarium-gui-wheel-smoke/bin/python -c "import pathlib,terrarium_gui; p=pathlib.Path(terrarium_gui.__file__).with_name('static')/'index.html'; assert p.is_file()"
